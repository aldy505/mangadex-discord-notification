name: Build

on:
  push:
  pull_request:

jobs:
  trufflehog:
    name: Trufflehog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27
          cache: true

      - name: Build
        run: go build .

      - name: Test
        run: go test -v ./...

  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    needs:
      - check
      - trufflehog
    permissions:
      contents: read
      packages: write
    if: github.ref_name == 'master' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Login
        run: docker login --username '${{ github.actor }}' --password '${{ github.token }}' ghcr.io

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          labels: |
            org.opencontainers.image.title=Mangadex Discord Notification
            org.opencontainers.image.description=Subscribe to Mangadex updates and get notified via Discord
            org.opencontainers.image.authors=Reinaldy Rafli
            org.opencontainers.image.url=https://github.com/aldy505/mangadex-discord-notification
            org.opencontainers.image.source=https://github.com/aldy505/mangadex-discord-notification
            org.opencontainers.image.licenses=MIT
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=edge

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          platforms: linux/amd64,linux/arm64